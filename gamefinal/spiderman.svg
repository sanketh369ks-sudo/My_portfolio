<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="140" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#b8001f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1e43" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff1e43"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#bgGrad)"/>

  <!-- Web Pattern -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none">
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="29" y1="29" x2="171" y2="171"/>
    <line x1="29" y1="171" x2="171" y2="29"/>
    <circle cx="100" cy="100" r="30"/>
    <circle cx="100" cy="100" r="60"/>
    <circle cx="100" cy="100" r="90"/>
  </g>

  <!-- Red Glow -->
  <circle cx="100" cy="100" r="70" fill="url(#glow)"/>

  <!-- Spider Mask Badge -->
  <ellipse cx="100" cy="100" rx="38" ry="46" fill="#ff1e43" stroke="#ffffff" stroke-width="3" filter="url(#neonShadow)"/>
  
  <!-- Spider Eyes -->
  <polygon points="72,82 92,98 70,114" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <polygon points="128,82 108,98 130,114" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Game Title Overlay -->
  <rect x="15" y="148" width="170" height="36" rx="8" fill="rgba(10, 12, 22, 0.85)" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="100" y="171" font-family="'Impact', 'Bebas Neue', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">SPIDER-MAN</text>
</svg>
