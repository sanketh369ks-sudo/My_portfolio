<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title> Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="container">
      <div style="margin-bottom: 15px; text-align: left;">
        <a href="../final.html" style="color: #7d2ae8; text-decoration: none; font-size: 0.95rem; font-weight: 600;">← Game Store</a>
      </div>
      <div class="result_field">
        <div class="result_images">
          <span class="user_result">
            <img src="images/human.webp" alt="" />
          </span>
          <span class="cpu_result">
            <img src="images/r.avif" alt="" />
          </span>
        </div>
        <div class="result">Let's Play!!</div>
      </div>
      <div class="scores">
        <p>User Score: <span id="user-score">0</span></p>
        <p>CPU Score: <span id="cpu-score">0</span></p>
      </div>
      <div class="option_images">
        <span class="option_image">
          <img src="images/rock.png" alt="" />
          <p>Rock</p>
        </span>
        <span class="option_image">
          <img src="images/paper.png" alt="" />
          <p>Paper</p>
        </span>
        <span class="option_image">
          <img src="images/scissors.png" alt="" />
          <p>Scissors</p>
        </span>
      </div>
    </section>
   <script src="script.js" defer></script>
  </body>
</html>
