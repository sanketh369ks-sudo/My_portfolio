<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Player Ping Pong Game</title>
    <style>
        canvas {
            background: #eee;
            display: block;
            margin: 0 auto;
            border: 1px solid #000;
        }
        #scoreboard {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="scoreboard">
        Player 1: <span id="score1">0</span> | Player 2: <span id="score2">0</span>
    </div>
    <canvas id="pingPongGame" width="800" height="400"></canvas>
    <script src="script.js"></script>
</body>
</html>
