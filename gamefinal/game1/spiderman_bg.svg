<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="40%" stop-color="#0b1026"/>
      <stop offset="80%" stop-color="#180b24"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>

    <radialGradient id="spideyGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff1e43" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0088ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bldgGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <linearGradient id="bldgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="340" cy="150" r="1"/>
    <circle cx="580" cy="60" r="2"/>
    <circle cx="750" cy="190" r="1.2"/>
    <circle cx="920" cy="90" r="1.8"/>
    <circle cx="1150" cy="140" r="1.5"/>
    <circle cx="1380" cy="70" r="2.2"/>
    <circle cx="1600" cy="180" r="1"/>
    <circle cx="1810" cy="100" r="1.6"/>
  </g>

  <!-- Spider Web Backdrop Matrix -->
  <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none">
    <!-- Web Radial Rays -->
    <line x1="960" y1="400" x2="0" y2="0"/>
    <line x1="960" y1="400" x2="480" y2="0"/>
    <line x1="960" y1="400" x2="960" y2="0"/>
    <line x1="960" y1="400" x2="1440" y2="0"/>
    <line x1="960" y1="400" x2="1920" y2="0"/>
    <line x1="960" y1="400" x2="1920" y2="540"/>
    <line x1="960" y1="400" x2="1920" y2="1080"/>
    <line x1="960" y1="400" x2="960" y2="1080"/>
    <line x1="960" y1="400" x2="0" y2="1080"/>
    <line x1="960" y1="400" x2="0" y2="540"/>

    <!-- Concentric Web Rings -->
    <polygon points="960,300 1040,360 1040,440 960,500 880,440 880,360"/>
    <polygon points="960,200 1120,320 1120,480 960,600 800,480 800,320"/>
    <polygon points="960,100 1240,260 1240,540 960,700 680,540 680,260"/>
    <polygon points="960,0 1360,200 1360,600 960,800 560,600 560,200"/>
  </g>

  <!-- Central Superhero Aura Glow -->
  <circle cx="960" cy="450" r="600" fill="url(#spideyGlow)"/>

  <!-- Distant City Skyline Silhouettes -->
  <g fill="url(#bldgGrad1)">
    <rect x="0" y="550" width="140" height="530"/>
    <rect x="120" y="480" width="90" height="600"/>
    <rect x="230" y="620" width="160" height="460"/>
    <rect x="410" y="420" width="110" height="660"/>
    <rect x="540" y="520" width="130" height="560"/>
    <rect x="690" y="380" width="150" height="700"/>
    <polygon points="765,280 755,380 775,380"/> <!-- Spire -->
    
    <rect x="860" y="490" width="140" height="590"/>
    <rect x="1020" y="440" width="120" height="640"/>
    <rect x="1160" y="360" width="160" height="720"/>
    <polygon points="1240,240 1230,360 1250,360"/> <!-- Chrysler Spire -->

    <rect x="1340" y="510" width="130" height="570"/>
    <rect x="1490" y="450" width="150" height="630"/>
    <rect x="1660" y="580" width="120" height="500"/>
    <rect x="1800" y="490" width="120" height="590"/>
  </g>

  <!-- Foreground City Buildings with Illuminated Windows -->
  <g fill="url(#bldgGrad2)">
    <rect x="50" y="650" width="180" height="430" stroke="rgba(255,30,67,0.3)" stroke-width="2"/>
    <rect x="300" y="580" width="220" height="500" stroke="rgba(0,136,255,0.3)" stroke-width="2"/>
    <rect x="600" y="620" width="240" height="460" stroke="rgba(255,30,67,0.3)" stroke-width="2"/>
    <rect x="1080" y="560" width="230" height="520" stroke="rgba(0,240,255,0.3)" stroke-width="2"/>
    <rect x="1400" y="640" width="220" height="440" stroke="rgba(255,30,67,0.3)" stroke-width="2"/>
  </g>

  <!-- Illuminated Window Grid Overlay -->
  <g fill="#ffcb05" opacity="0.35">
    <!-- Building 1 -->
    <rect x="75" y="680" width="18" height="24"/><rect x="115" y="680" width="18" height="24"/><rect x="155" y="680" width="18" height="24"/>
    <rect x="75" y="730" width="18" height="24"/><rect x="155" y="730" width="18" height="24"/>
    <rect x="115" y="780" width="18" height="24"/><rect x="155" y="780" width="18" height="24"/>

    <!-- Building 2 -->
    <rect x="330" y="620" width="20" height="30"/><rect x="380" y="620" width="20" height="30"/><rect x="430" y="620" width="20" height="30"/>
    <rect x="330" y="680" width="20" height="30"/><rect x="430" y="680" width="20" height="30"/>
    <rect x="380" y="740" width="20" height="30"/><rect x="430" y="740" width="20" height="30"/>

    <!-- Building 3 (Tower) -->
    <rect x="1110" y="600" width="22" height="32"/><rect x="1160" y="600" width="22" height="32"/><rect x="1210" y="600" width="22" height="32"/>
    <rect x="1110" y="660" width="22" height="32"/><rect x="1210" y="660" width="22" height="32"/>
    <rect x="1160" y="720" width="22" height="32"/><rect x="1210" y="720" width="22" height="32"/>
  </g>

  <!-- Large Stylized Spider Emblem Silhouette in Sky -->
  <g transform="translate(960, 380) scale(1.6)" filter="url(#glow)">
    <path d="M0,-80 L12,-40 L35,-70 L20,-20 L50,-40 L25,10 L60,0 L20,30 L40,80 L10,40 L0,90 L-10,40 L-40,80 L-20,30 L-60,0 L-25,10 L-50,-40 L-20,-20 L-35,-70 L-12,-40 Z" fill="rgba(255, 30, 67, 0.4)" stroke="#ffffff" stroke-width="2"/>
    <!-- Spider Eyes -->
    <polygon points="-12,-35 -4,-25 -16,-15" fill="#ffffff"/>
    <polygon points="12,-35 4,-25 16,-15" fill="#ffffff"/>
  </g>

  <!-- Bottom Gradient Vignette -->
  <rect x="0" y="800" width="1920" height="280" fill="url(#skyGrad)"/>
</svg>
