<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Multimedia Editor</title>
</head>
<body>
    <header>
        <h1>Multimedia Editor</h1>
    </header>
    <main>
        <div class="editor">
            <input type="file" id="fileInput" accept="image/*,video/*" multiple>
            <canvas id="canvas"></canvas>
            <div class="controls">
                <h3>Basic Editing</h3>
                <button id="cutPhoto">Crop Photo</button>
                <button id="resize">Resize</button>
                <button id="rotate">Rotate</button>
                <button id="flip">Flip</button>
                <button id="download">Download</button>
                
                <h3>Color Adjustments</h3>
                <input type="range" id="brightness" min="-100" max="100" value="0"> Brightness
                <input type="range" id="contrast" min="-100" max="100" value="0"> Contrast
                <input type="range" id="saturation" min="-100" max="100" value="0"> Saturation
                
                <h3>Drawing Tools</h3>
                <button id="draw">Freehand Draw</button>
                <button id="textTool">Add Text</button>
                
                <h3>Stickers</h3>
                <button id="addSticker">Add Sticker</button>
                
                <h3>Video Editing</h3>
                <button id="trimVideo">Trim Video</button>
                <button id="addMusic">Add Music</button>
                
                <h3>Advanced</h3>
                <button id="faceSwap">Face Swap</button>
            </div>
            <input type="text" id="textInput" placeholder="Enter text here" style="display:none;">
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
